[target.'cfg(target_os = "macos")']
# Rust 1.96 的 strip 可能生成 macOS 27 无法加载的 Mach-O，见 rust-lang/rust#157750。
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup", "-C", "strip=none"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.i686-pc-windows-msvc]
linker = "rust-lld"

[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=-crt-static"]
