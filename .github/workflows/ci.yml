name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'composer.json'
      - 'stubs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'composer.json'
      - 'stubs/**'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Install through install-php-extensions
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -f docker/Dockerfile -t lexsift-docker-test .
      - name: Verify extension in runtime image
        run: docker run --rm -i lexsift-docker-test php < tests/docker/smoke.php

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: macos-latest
            php: '8.1'
          - os: macos-latest
            php: '8.5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, pie
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-php-${{ matrix.php }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf clang libclang-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew list autoconf || brew install autoconf
      - run: composer validate --strict
      - run: cargo fmt --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: sh scripts/build.sh
      - run: cargo clippy --locked --lib -- -D warnings
      - run: php -n -d extension="$PWD/target/php-build/modules/lexsift.so" --ri lexsift
      - run: composer install --working-dir=tests/php --no-interaction --prefer-dist
        env:
          COMPOSER: ${{ matrix.php == '8.1' && 'composer-php81.json' || matrix.php == '8.5' && 'composer-php85.json' || 'composer.json' }}
      - run: sh scripts/test-php.sh
      - name: Install local package through PIE
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.5'
        run: sh scripts/test-pie.sh
